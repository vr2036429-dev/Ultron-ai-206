name: Build & Release ULTRON Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Bulletproof Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js 20 environment with npm caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java JDK 17 (Temurin)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Gradle Cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 5. Smart Dependency Installation (npm ci if lockfile present, else npm install)
      - name: Install NPM Dependencies
        run: |
          echo "==> STEP 1: Installing dependencies..."
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci || npm install
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

          # Ensure Capacitor packages are present
          if ! npm list @capacitor/core >/dev/null 2>&1; then
            echo "Installing Capacitor core and CLI..."
            npm install @capacitor/core @capacitor/cli @capacitor/android --save
          fi
          echo "==> Dependencies successfully installed."

      # 6. Build Web Application Assets with Vite
      - name: Build Web Application
        run: |
          echo "==> STEP 2: Building web production assets (npm run build)..."
          if npm run build; then
            echo "==> Web build completed successfully."
          else
            echo "ERROR: Web build failed!"
            ls -la
            exit 1
          fi

      # 7. Setup & Sync Capacitor Android
      - name: Setup & Sync Capacitor Android
        run: |
          echo "==> STEP 3: Configuring Android platform..."
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          fi

          # Ensure Android permissions in AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Checking and injecting Android permissions..."
            PERMISSIONS='
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.FLASHLIGHT" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />'

            if ! grep -q "RECORD_AUDIO" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a $PERMISSIONS" "$MANIFEST_PATH"
              echo "Permissions injected."
            fi
          fi

          echo "Syncing Capacitor Android..."
          npx cap sync android
          echo "==> Capacitor Android sync complete."

      # 8. Ensure Gradlew exists and is executable
      - name: Ensure Gradlew Wrapper and Permissions
        run: |
          echo "==> STEP 4: Verifying Gradle wrapper..."
          cd android
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing! Generating Gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew
          echo "==> gradlew is ready and executable."

      # 9. Build Debug APK with Gradle inside android/ folder
      - name: Build Android Debug APK
        run: |
          echo "==> STEP 5: Building Debug APK via Gradle..."
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "==> Gradle assembleDebug finished."

      # 10. Locate, rename and verify APK
      - name: Prepare APK Asset
        id: apk_step
        run: |
          echo "==> STEP 6: Locating generated APK..."
          DEFAULT_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$DEFAULT_PATH" ]; then
            APK_FOUND="$DEFAULT_PATH"
          else
            echo "Standard path not found, scanning for debug APK..."
            APK_FOUND=$(find android -type f -name "*debug*.apk" | head -n 1)
          fi

          if [ -z "$APK_FOUND" ] || [ ! -f "$APK_FOUND" ]; then
            echo "ERROR: Could not locate generated APK!"
            ls -laR android/app/build/outputs/ || true
            exit 1
          fi

          FINAL_APK_NAME="ULTRON-v1.0.${{ github.run_number }}.apk"
          cp "$APK_FOUND" "$FINAL_APK_NAME"
          echo "apk_file=$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "==> APK ready: $FINAL_APK_NAME ($(du -h "$FINAL_APK_NAME" | cut -f1))"

      # 11. Upload APK as workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-Debug-APK
          path: ${{ steps.apk_step.outputs.apk_file }}
          retention-days: 14

      # 12. Create GitHub Release and attach APK
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_step.outputs.tag }}
          name: "ULTRON ${{ steps.apk_step.outputs.tag }}"
          files: ${{ steps.apk_step.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🤖 ULTRON Jarvis Android Assistant - Automatic Debug Build
            
            **Version**: `${{ steps.apk_step.outputs.tag }}` (Build #${{ github.run_number }})
            
            #### 📦 Download Ready APK
            - **Download**: [`${{ steps.apk_step.outputs.apk_file }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.apk_step.outputs.tag }}/${{ steps.apk_step.outputs.apk_file }})
            
            *(Signed automatically with Android debug key — install directly on your phone)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. Diagnostics if any step fails
      - name: Print Debug Tree on Failure
        if: failure()
        run: |
          echo "=== BUILD FAILED: REPOSITORY STRUCTURE DIAGNOSTICS ==="
          ls -la
          echo "=== ANDROID DIRECTORY (IF PRESENT) ==="
          ls -laR android/ || true
