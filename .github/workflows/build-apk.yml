name: Build APK & Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build web app
        run: npm run build
      - name: Add and sync Android
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android/ incomplete, regenerating..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          ls -la android
      - name: Inject Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
            fi
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: |
          APK=$(find android -name "*-debug.apk" | head -n 1)
          cp "$APK" ULTRON-v1.0.${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: ULTRON-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
