name: Build & Release ULTRON Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js 20 environment with npm caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Gradle Cache for lightning-fast builds
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 5. Install Project Dependencies
      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      # 6. Build Web Production Assets with Vite
      - name: Build Web Application
        run: |
          npx vite build

      # 7. Setup & Sync Capacitor Android
      - name: Setup & Sync Capacitor Android
        run: |
          # If capacitor android project does not exist yet, initialize it
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

          # Ensure AndroidManifest contains necessary voice and device permissions
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Injecting Android permissions into AndroidManifest.xml..."
            PERMISSIONS='
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.FLASHLIGHT" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />'

            if ! grep -q "RECORD_AUDIO" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a $PERMISSIONS" "$MANIFEST_PATH"
            fi
          fi

          npx cap sync android

      # 8. Grant execute permission to gradlew
      - name: Grant Execute Permission to gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # 9. Build Debug APK (Android signs automatically with debug key - No secrets or keystore needed)
      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      # 10. Locate, rename and prepare the generated debug APK
      - name: Prepare APK Asset
        id: apk_step
        run: |
          APK_FOUND=$(find . -name "*-debug.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: Debug APK not found in build outputs!"
            exit 1
          fi
          
          FINAL_APK_NAME="ULTRON-v1.0.${{ github.run_number }}.apk"
          cp "$APK_FOUND" "$FINAL_APK_NAME"
          echo "apk_file=$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Successfully created: $FINAL_APK_NAME"
          ls -lh "$FINAL_APK_NAME"

      # 11. Upload APK as workflow artifact (Available directly on Actions summary)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-Debug-APK
          path: ${{ steps.apk_step.outputs.apk_file }}
          retention-days: 14

      # 12. Create GitHub Release and attach APK
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_step.outputs.tag }}
          name: "ULTRON ${{ steps.apk_step.outputs.tag }}"
          files: ${{ steps.apk_step.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🤖 ULTRON Jarvis Android Assistant - Automatic Debug Build
            
            **Version**: `${{ steps.apk_step.outputs.tag }}`
            
            #### 📦 Download APK
            - **Download Ready APK**: [`${{ steps.apk_step.outputs.apk_file }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.apk_step.outputs.tag }}/${{ steps.apk_step.outputs.apk_file }})
            
            *(Signed automatically with Android debug key — ready to install directly on your phone)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
